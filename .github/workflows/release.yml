name: Release

on:
  push:
    tags:
      # A CalVer tag: "2026.1.0". The "v" prefix is optional and accepted, the
      # published version never carries it. The pattern is deliberately broad,
      # the "verify" job rejects everything that is not a CalVer tag.
      - "[0-9]*"
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the git tags, the whole history is needed.
          fetch-depth: 0

      - name: Check that the tag is a CalVer tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '$GITHUB_REF_NAME' is not a CalVer tag. Expected 'YYYY.MINOR.PATCH', for example '2026.1.0'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - name: Check the version the build backend resolves
        run: |
          resolved="$(uvx uv-dynamic-versioning)"
          if [ "$resolved" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::The build backend resolves the version '$resolved', the tag says '${{ steps.tag.outputs.version }}'."
            exit 1
          fi
          echo "The tag resolves to the version $resolved."

  build:
    name: Build the sdist and the wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      # The package is pure Python, so the wheel is a single "py3-none-any"
      # wheel. It is valid for CPython 3.13, 3.14 and the free-threaded
      # 3.14t. The "test" job installs it on each of them.
      - name: Build
        run: uv build

      - name: Check the artifact names
        run: |
          ls -l dist
          if ! ls dist/*"${{ needs.verify.outputs.version }}"*.tar.gz > /dev/null; then
            echo "::error::No sdist for the version ${{ needs.verify.outputs.version }}."
            exit 1
          fi
          if ! ls dist/*"${{ needs.verify.outputs.version }}"*.whl > /dev/null; then
            echo "::error::No wheel for the version ${{ needs.verify.outputs.version }}."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test the wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "3.14t" is the free-threaded build of CPython 3.14.
        python-version: ["3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the wheel
        run: |
          uv venv
          uv pip install --python .venv/bin/python dist/*.whl pytest pytest-cov

      - name: Test
        env:
          # The free-threaded build enables the GIL by default. "0" keeps it
          # disabled, so the test suite really runs without the GIL.
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '1' }}
        run: |
          # "pythonpath=tests" drops the source tree from the import path, so
          # the tests run against the installed wheel and not against "src".
          .venv/bin/python -m pytest -o pythonpath=tests --cov=itu_doc_downloader

  publish:
    name: Publish to PyPI
    needs: [verify, build, test]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies the identity of this workflow with
      # the OIDC token of the job, no API token is involved.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1
        with:
          packages-dir: dist/
          verbose: true

  github-release:
    name: Create the GitHub release
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - name: Generate the changelog
        run: |
          python .github/scripts/release_notes.py \
            --tag "$GITHUB_REF_NAME" \
            --version "${{ needs.verify.outputs.version }}" \
            > release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ needs.verify.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
