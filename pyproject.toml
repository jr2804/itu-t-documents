[project]
name = "itu-t-documents"
dynamic = ["version"]
description = "Download and query ITU-T meeting documents (contributions, temporary documents, collective letters, reports) via API, CLI and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "github@jan-reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cyclopts>=5.0.0",
    "fastmcp>=4.2.6",
    "hishel>=2.0.0",
    "httpx>=0.29.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
# The development environment of the package itself: what the tests need.
# The documentation builder is a tool, not a dependency of the package — it
# lives outside this environment, see .config/mise/conf.d/docs.toml.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ghp-import>=2.1",
]

[project.scripts]
itu-t-documents = "itu_t_documents.cli.app:main"

[project.optional-dependencies]
secretspec = ["secretspec>=0.21.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/itu_t_documents"]
exclude = ["/src/itu_t_documents/mcp/AGENTS.md"]

[tool.hatch.build.targets.sdist]
# The distribution carries the package, its tests and its documentation. The
# development internals are not part of a release: the agent contracts, the
# issue tracker with its database, the continuous integration, the tool
# configuration and the artifacts of the linters.
#
# The patterns of the directories end in "/*", because a pattern without it
# only matches the directory itself and not the files below it. The list is
# explicit on purpose: the exclusion of the version control is not enough,
# a pattern with a trailing slash does not match a file path.
exclude = [
    "/.agents/*",
    "/.beads/*",
    "/.cache/*",
    "/.config/*",
    "/.cursor/*",
    "/.github/*",
    "/.ruff_cache/*",
    "/.rumdl_cache/*",
    "/.venv/*",
    "/htmlcov/*",
    "/scripts/*",
    "/site/*",
    "/tests/test-cache/*",
    "/AGENTS.md",
    "/docs/AGENTS.md",
    "/src/itu_t_documents/mcp/AGENTS.md",
    "/TOOLS.md",
    "/.coverage",
    "/coverage.xml",
    "/ruff.toml",
    "/ty.toml",
    "/zensical.toml",
    "/.copier-answers.yml",
    "/.pre-commit-config.yaml",
]

[build-system]
# 0.8 is the first release that knows the "format-jinja" option, an older
# plugin would silently ignore it.
requires = ["hatchling", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# CalVer: YYYY.MM.N. The tag carries an optional "v" prefix, the published
# version never does. See docs/release.md.
pattern = '^v?(?P<base>\d{4}\.(0[1-9]|1[0-2])\.[1-9]\d*)$'
# A source tree without a usable VCS (an exported tarball, a vendored copy).
fallback-version = "0.0.0.dev0"
# An exact tag yields the bare version. Everything else yields a PEP 440
# development version: "<base>.dev<distance>+<commit>" for a commit that
# follows a tag, "<year>.<month>.0.dev<distance>+<commit>" for a tree without
# any CalVer tag, and a ".dirty" local segment for an unclean working tree.
# The timestamp of the commit is a "YYYYMMDDHHMMSS" string, so the year is
# its first four characters and the month its next two.
#
# PEP 440 does not allow a leading zero in the release segment, so the
# published version drops the zero of the month: the tag "2027.01.1" publishes
# the version "2027.1.1". The tag keeps the zero, because it is the spelling
# a human reads.
format-jinja = '''
{%- if base == "0.0.0" -%}
{%- if timestamp -%}
{{ timestamp[:4] }}.{{ timestamp[4:6] | int }}.0.dev{{ distance }}{{ ("+" ~ commit) if commit else "" }}{{ ".dirty" if dirty else "" }}
{%- else -%}
0.0.0.dev{{ distance }}{{ ("+" ~ commit) if commit else "" }}{{ ".dirty" if dirty else "" }}
{%- endif -%}
{%- else -%}
{%- set parts = base.split(".") -%}
{%- set published = parts[0] ~ "." ~ (parts[1] | int) ~ "." ~ parts[2] -%}
{%- if distance == 0 and not dirty -%}
{{ published }}
{%- else -%}
{{ published }}.dev{{ distance }}{{ ("+" ~ commit) if commit else "" }}{{ ".dirty" if dirty else "" }}
{%- endif -%}
{%- endif -%}
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short --cov=itu_t_documents --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["itu_t_documents"]

[tool.coverage.report]
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
