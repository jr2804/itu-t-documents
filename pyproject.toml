[project]
name = "itu-doc-downloader"
dynamic = ["version"]
description = "Download and query ITU-T meeting documents (contributions, temporary documents, collective letters, reports) via API, CLI and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "github@jan-reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cyclopts>=5.0.0",
    "fastmcp>=4.2.6",
    "hishel>=2.0.0",
    "httpx>=0.29.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
itu-doc-downloader = "itu_doc_downloader.cli.app:main"

[project.optional-dependencies]
secretspec = ["secretspec>=0.21.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/itu_doc_downloader"]

[build-system]
# 0.8 is the first release that knows the "format-jinja" option, an older
# plugin would silently ignore it.
requires = ["hatchling", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# CalVer: YYYY.MINOR.PATCH. The tag carries an optional "v" prefix, the
# published version never does. See docs/release.md.
pattern = '^v?(?P<base>\d{4}\.\d+\.\d+)$'
# A source tree without a usable VCS (an exported tarball, a vendored copy).
fallback-version = "0.0.0.dev0"
# An exact tag yields the bare version. Everything else yields a PEP 440
# development version: "<base>.dev<distance>+<commit>" for a commit that
# follows a tag, "<year>.0.0.dev<distance>+<commit>" for a tree without any
# CalVer tag, and a ".dirty" local segment for an unclean working tree.
format-jinja = '''
{%- if base == "0.0.0" -%}
{{ (timestamp or "0")[:4] }}.0.0.dev{{ distance }}{{ ("+" ~ commit) if commit else "" }}{{ ".dirty" if dirty else "" }}
{%- elif distance == 0 and not dirty -%}
{{ base }}
{%- else -%}
{{ base }}.dev{{ distance }}{{ ("+" ~ commit) if commit else "" }}{{ ".dirty" if dirty else "" }}
{%- endif -%}
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short --cov=itu_doc_downloader --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["itu_doc_downloader"]

[tool.coverage.report]
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
