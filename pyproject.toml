[project]
name = "itu-doc-downloader"
dynamic = ["version"]
description = "Download and query ITU-T meeting documents (contributions, temporary documents, collective letters, reports) via API, CLI and MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "github@jan-reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cyclopts>=5.0.0",
    "fastmcp>=4.2.6",
    "hishel>=2.0.0",
    "httpx>=0.29.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
itu-doc-downloader = "itu_doc_downloader.cli.app:main"

[project.optional-dependencies]
secretspec = ["secretspec>=0.21.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/itu_doc_downloader"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short --cov=itu_doc_downloader --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["itu_doc_downloader"]

[tool.coverage.report]
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
