<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
  <title>The structure of a study group</title>
  <desc>A study period holds a study group. The study group lists a plenary, working groups, other groups and questions. The plenary and the working groups handle the questions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#A1A1AA"/></marker>
  </defs>
  <rect width="760" height="430" fill="#18181B"/>
  <!-- Edges are drawn before the nodes so every line ends cleanly on a border. -->
  <path d="M380 72 L380 110" fill="none" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M380 164 L380 188 L120 188 L120 208" fill="none" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M380 164 L380 208" fill="none" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M380 164 L380 188 L620 188 L620 208" fill="none" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M120 266 L120 300 L250 300 L250 328" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <path d="M380 266 L380 328" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="280" y="20" width="200" height="52" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="380.0" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Study period</text>
  <text x="380.0" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">2025-2028</text>

  <rect x="280" y="112" width="200" height="52" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="380.0" y="134" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Study group</text>
  <text x="380.0" y="154" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">SG12</text>

  <rect x="20" y="210" width="200" height="56" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="120.0" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Plenary</text>
  <text x="120.0" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">PLEN</text>

  <rect x="280" y="210" width="200" height="56" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="380.0" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Working groups</text>
  <text x="380.0" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">WP1/12 · WP2/12 · WP3/12</text>

  <rect x="540" y="210" width="200" height="56" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="640.0" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Other groups</text>
  <text x="640.0" y="252" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">regional · focus · …</text>

  <rect x="150" y="330" width="460" height="60" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="380.0" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">Questions under study</text>
  <text x="380.0" y="372" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">Q1/12 · Q2/12 · Q4/12 · …</text>

  <text x="388" y="97" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">holds</text>
  <text x="388" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#A1A1AA">handles</text>
</svg>
